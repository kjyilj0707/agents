<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프로젝트 관계 그래프</title>
<style>
  :root {
    --bg: #0b0b16; --panel: #12121f; --panel2: #1a1a2c; --line: #2a2a42;
    --text: #e8e8f4; --dim: #8a8aa6; --accent: #00f5ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 13px/1.45 'Segoe UI', 'Malgun Gothic', sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 250px 1fr; height: 100%; }
  aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 12px 20px; }
  h1 { font-size: 15px; margin: 0 0 2px; letter-spacing: .2px; }
  .sub { color: var(--dim); font-size: 11.5px; margin-bottom: 12px; }
  .sec { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .8px; margin: 16px 0 6px; }
  input[type=search] { width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); outline: none; }
  input[type=search]:focus { border-color: var(--accent); }
  .proj { display: flex; justify-content: space-between; gap: 6px; padding: 5px 8px; border-radius: 6px; cursor: pointer;
    color: #cfd0e6; white-space: nowrap; }
  .proj span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .proj:hover { background: var(--panel2); }
  .proj.on { background: #00f5ff1f; color: #fff; box-shadow: inset 2px 0 0 var(--accent); }
  .proj .n { color: var(--dim); font-size: 11px; }
  .proj.rootrow { margin-top: 8px; font-weight: 600; color: #fff; }
  #projects .proj:not(.rootrow) { padding-left: 22px; }
  #projects .proj:first-child { padding-left: 8px; }
  #projects .proj.rootrow.under { padding-left: 16px; }
  #projects .proj.under:not(.rootrow) { padding-left: 38px; }
  .root { color: var(--dim); font-size: 11px; margin: 8px 0 2px 8px; }
  .seg { display: flex; background: var(--panel2); border-radius: 7px; padding: 2px; }
  .seg button { flex: 1; border: 0; background: none; color: var(--dim); padding: 6px; border-radius: 5px; cursor: pointer; font: inherit; }
  .seg button.on { background: #00f5ff26; color: #fff; }
  label.chk { display: flex; align-items: center; gap: 7px; padding: 2px 4px; cursor: pointer; color: #cfd0e6; }
  label.chk input { accent-color: var(--accent); margin: 0; }
  .sw { width: 22px; height: 0; border-top: 2px solid; display: inline-block; }
  .dot, .sw { forced-color-adjust: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; box-shadow: 0 0 6px currentColor; background: currentColor; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 3px 8px; color: #cfd0e6; }
  .legend div { display: flex; align-items: center; gap: 6px; }
  .hint { color: var(--dim); font-size: 11.5px; margin-top: 14px; line-height: 1.6; }
  main { position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: #000c; border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 8px; font-size: 12px; display: none; max-width: 420px; }
  #tip .p { color: var(--dim); font-size: 11px; }
  #info { position: absolute; top: 12px; right: 12px; width: 330px; max-height: calc(100% - 24px); overflow-y: auto;
    background: #12121ff2; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: none;
    backdrop-filter: blur(6px); }
  #info h2 { font-size: 14px; margin: 0 0 3px; word-break: break-all; }
  #info .p { color: var(--dim); font-size: 11.5px; word-break: break-all; }
  #info .btns { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; }
  #info button, .btn { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 6px;
    padding: 5px 9px; cursor: pointer; font: inherit; font-size: 12px; }
  #info button:hover, .btn:hover { border-color: var(--accent); }
  #info .grp { margin-top: 10px; }
  #info .grp b { font-size: 11.5px; color: var(--dim); font-weight: 600; display: block; margin-bottom: 3px; }
  #info .it { padding: 3px 6px; border-radius: 5px; cursor: pointer; display: flex; gap: 7px; align-items: center; }
  #info .it:hover { background: var(--panel2); }
  #info .it span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #close { position: absolute; top: 8px; right: 10px; background: none !important; border: 0 !important; font-size: 16px !important; color: var(--dim) !important; }
  #crumb { position: absolute; top: 12px; left: 14px; right: 360px; z-index: 2; font-size: 14px; pointer-events: none; }
  #crumb .path { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #crumb a { pointer-events: auto; color: #cfd0e6; cursor: pointer; padding: 3px 8px; border-radius: 6px; background: #ffffff10; }
  #crumb a:hover { background: #00f5ff26; color: #fff; }
  #crumb b { padding: 3px 8px; border-radius: 6px; background: #00f5ff26; color: #fff; font-weight: 600; }
  #crumb .say { color: var(--dim); font-size: 12.5px; margin-top: 7px; }
  details summary { list-style: none; }
  details summary::before { content: '▸ '; }
  details[open] summary::before { content: '▾ '; }
  #stats { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 11.5px; pointer-events: none; }
  #zoom { position: absolute; right: 12px; bottom: 10px; display: flex; gap: 4px; }
  #agents { position: absolute; right: 12px; bottom: 46px; display: none; gap: 4px; align-items: center; }
  #agents span { color: var(--dim); font-size: 11.5px; margin-right: 4px; }
  @media (max-width: 700px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 42% 58%; }
    #info { width: auto; left: 12px; }
  }
</style>
</head>
<body>
<div id="app">
  <aside>
    <h1>🧠 프로젝트 관계 그래프</h1>
    <div class="sub" id="gen"></div>
    <input id="q" type="search" placeholder="파일 이름 검색 (Enter로 이동)">
    <div class="sec">보기</div>
    <div class="seg" id="layout">
      <button data-v="force" class="on">신경망</button>
      <button data-v="layer">흐름 레이어</button>
    </div>
    <div class="sec">프로젝트</div>
    <div id="projects"></div>
    <div class="sec">색 읽는 법</div>
    <div class="legend" id="legend"></div>
    <div class="legend" id="legend2" style="margin-top:6px"></div>
    <div class="hint">
      클릭: 안으로 들어가기 / 그 파일의 흐름만 보기<br>
      더블클릭: VS Code에서 열기<br>
      휠: 확대 · 빈 곳 드래그: 이동 · Esc: 뒤로
    </div>
    <details>
      <summary class="sec" style="cursor:pointer">세부 설정</summary>
      <div class="sec">관계</div>
      <div id="types"></div>
      <div class="sec">표시</div>
      <label class="chk"><input type="checkbox" id="hideIso" checked> 연결 없는 파일 숨기기</label>
      <label class="chk"><input type="checkbox" id="hideCopy" checked> 사본 폴더(제출자료 등) 숨기기</label>
      <label class="chk"><input type="checkbox" id="labels" checked> 이름 항상 표시</label>
      <label class="chk"><input type="checkbox" id="pulse" checked> 흐름 애니메이션</label>
    </details>
  </aside>
  <main>
    <div id="crumb"></div>
    <canvas id="cv"></canvas>
    <div id="tip"></div>
    <div id="info"></div>
    <div id="stats"></div>
    <div id="zoom"><button class="btn" id="fit">화면 맞춤</button></div>
    <div id="agents"><span id="agentsLabel"></span><label class="chk" title="프로젝트나 상위 폴더를 누르면 Claude 세션과 에이전트 연구실을 함께 연다"><input type="checkbox" id="agAuto" checked> 누르면 바로 열기</label><button class="btn" id="agFlow">🤖 에이전트 보기</button><button class="btn" id="agTerm">▶ Claude + 연구실</button></div>
  </main>
</div>
<script>
const G = /*__GRAPH_DATA__*/null;

const KIND = {
  code:     { c: '#00f5ff', t: '코드 .py' },
  notebook: { c: '#ff9f1c', t: '노트북' },
  data:     { c: '#39ff88', t: '데이터' },
  media:    { c: '#ff3df2', t: '그림·음원' },
  web:      { c: '#ffe14d', t: '웹 html/js' },
  doc:      { c: '#b18cff', t: '문서' },
  folder:   { c: '#8a9bb8', t: '폴더' },
};
const TYPE = {
  read:    { c: '#39ff88', t: '읽기 (데이터 → 코드)', flow: true },
  write:   { c: '#ff3df2', t: '생성 (코드 → 결과)', flow: true },
  import:  { c: '#00f5ff', t: 'import (모듈 → 사용처)', flow: true },
  use:     { c: '#7f8fa6', t: '경로 참조', flow: false },
  mention: { c: '#b18cff', t: '문서 언급', flow: false, dash: [4, 4] },
  copy:    { c: '#d0d0e0', t: '같은 내용 사본', flow: false, dash: [1.5, 4] },
  tree:    { c: '#ffffff', t: '포함', flow: false, pulse: true, hidden: true },
};
const COPY_DIR = /(^|\/)(제출자료|submission|backup|백업|copy|사본)(\/|$)/i;

const vscodeApi = typeof acquireVsCodeApi === 'function' ? acquireVsCodeApi() : null;
function openPath(n, reveal) {
  const folder = n.group || reveal;
  if (vscodeApi) { vscodeApi.postMessage({ type: folder ? 'reveal' : 'open', path: n.path }); return; }
  location.href = folder
    ? 'vscode://kjyil.project-map-reveal/reveal?path=' + encodeURIComponent(n.path)
    : 'vscode://file/' + encodeURI(n.path);
}

// ───────────── 데이터 준비 ─────────────
const byId = new Map(G.nodes.map(n => [n.id, n]));
G.links.forEach(l => { l.s = byId.get(l.source); l.t = byId.get(l.target); });
G.links = G.links.filter(l => l.s && l.t);
const projById = new Map(G.projects.map(p => [p.id, p]));

const state = {
  project: '*',
  layout: 'force',
  types: { read: true, write: true, import: true, use: false, mention: false, copy: false },
  hideIso: true, hideCopy: true, labels: true, pulse: true,
  sel: null, hover: null, query: '', focus: null, depth: 2, root: null,
};
function count(pid) { return pid === '*' ? G.nodes.length : G.nodes.filter(n => n.project === pid).length; }
function localGet(k) { try { return localStorage.getItem('pg.' + k); } catch (e) { return null; } }
function localSet(k, v) { try { localStorage.setItem('pg.' + k, v); } catch (e) {} }

document.getElementById('gen').textContent = `생성 ${G.generated} · 파일 ${G.nodes.length} · 관계 ${G.links.length}`;

// 사이드바
const projEl = document.getElementById('projects');
function renderProjects() {
  projEl.innerHTML = '';
  const all = document.createElement('div');
  all.className = 'proj' + (state.project === '*' && !state.root ? ' on' : '');
  all.innerHTML = `<span>🌐 전체 작업공간</span><span class="n">${G.nodes.length}</span>`;
  all.onclick = () => setRoot(null);
  projEl.appendChild(all);
  let lastRoot = null;
  // MANAGE 를 맨 위에, 나머지 상위 폴더는 그 아래로 들여쓴다
  const ordered = [...G.projects].sort((a, b) => (b.root === MANAGER) - (a.root === MANAGER));
  for (const p of ordered) {
    const under = MANAGER && p.root !== MANAGER ? ' under' : '';
    if (p.root !== lastRoot) {
      const r = document.createElement('div');
      r.className = 'proj rootrow' + under + (state.project === '*' && state.root === p.root ? ' on' : '');
      const n = G.projects.filter(q => q.root === p.root).length;
      r.innerHTML = `<span>${under ? '└ ' : ''}🗂 ${esc(p.root)}</span><span class="n">${p.root === MANAGER ? '관리 · ' : ''}프로젝트 ${n}</span>`;
      const root = p.root; r.onclick = () => setRoot(root);
      projEl.appendChild(r);
      lastRoot = p.root;
    }
    const d = document.createElement('div');
    d.className = 'proj' + under + (state.project === p.id ? ' on' : '');
    const links = G.links.filter(l => l.project === p.id).length;
    d.innerHTML = `<span title="${p.name}">${p.name}</span><span class="n">${count(p.id)} · ${links}</span>`;
    d.onclick = () => setProject(p.id);
    projEl.appendChild(d);
  }
}
const typesEl = document.getElementById('types');
for (const [k, v] of Object.entries(TYPE)) {
  if (v.hidden) continue;
  const lab = document.createElement('label'); lab.className = 'chk';
  lab.innerHTML = `<input type="checkbox" ${state.types[k] ? 'checked' : ''}> <span class="sw" style="border-color:${v.c};${v.dash ? 'border-top-style:dashed' : ''}"></span> ${v.t}`;
  lab.querySelector('input').onchange = e => { state.types[k] = e.target.checked; rebuild(false); };
  typesEl.appendChild(lab);
}
const legendEl = document.getElementById('legend');
for (const k of ['read', 'write', 'import']) {
  const d = document.createElement('div');
  d.innerHTML = `<span class="sw" style="border-color:${TYPE[k].c}"></span>${TYPE[k].t.split(' (')[0]}`;
  document.getElementById('legend2').appendChild(d);
}
for (const v of Object.values(KIND)) {
  const d = document.createElement('div');
  d.innerHTML = `<span class="dot" style="color:${v.c}"></span>${v.t}`;
  legendEl.appendChild(d);
}
for (const id of ['hideIso', 'hideCopy']) {
  document.getElementById(id).onchange = e => { state[id] = e.target.checked; rebuild(true); };
}
document.getElementById('labels').onchange = e => { state.labels = e.target.checked; };
document.getElementById('pulse').onchange = e => { state.pulse = e.target.checked; };
document.querySelectorAll('#layout button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#layout button').forEach(x => x.classList.toggle('on', x === b));
  state.layout = b.dataset.v;
  if (state.focus) exitFocus(); else applyLayout(true);
});

// ───────────── 그래프 상태 ─────────────
let nodes = [], links = [], adjOut = new Map(), adjIn = new Map(), clusters = [];
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
const view = { x: 0, y: 0, k: 1 };

function setProject(pid) {
  state.project = pid; state.sel = null; state.focus = null; lineage = null;
  renderProjects(); hideInfo(); rebuild(true); updateAgents(); autoLaunch();
}
// 프로젝트·상위 폴더를 누르면 그 폴더의 Claude 세션(실행 스크립트가 있으면 그것)과 에이전트 연구실을 함께 연다.
// 같은 폴더의 터미널이 이미 있으면 새로 만들지 않고 앞으로 가져온다(확장 쪽에서 처리).
function autoLaunch() {
  const box = document.getElementById('agAuto');
  if (!vscodeApi || (box && !box.checked)) return;
  if (state.project === '*' && !state.root) return;
  const r = agentRoot(); if (r) vscodeApi.postMessage({ type: 'claude', path: r.path });
}
function setRoot(r) {
  state.root = r; setProject('*');
}
function exitFocus() {
  state.depth = 2; state.focus = null; state.sel = null; lineage = null; hideInfo(); rebuild(true);
}
const layoutMode = () => state.focus ? 'layer' : state.project === '*' ? 'force' : state.layout;

// 전체 보기용 프로젝트 노드
const ROOT_COLOR = ['#00f5ff', '#ff9f1c', '#39ff88', '#b18cff'];
const ROOTS = [...new Set(G.projects.map(q => q.root))];
const hubs = G.projects.map(p => {
  const core = G.links.filter(l => l.project === p.id && TYPE[l.type].flow).length;
  return { id: 'P:' + p.id, hub: true, project: p.id, label: p.name, rel: p.root + '/' + p.name, path: p.path,
    group: true, count: p.files, core, kind: 'project', dir: '',
    color: ROOT_COLOR[ROOTS.indexOf(p.root) % ROOT_COLOR.length] };
});
const hubLinks = (() => {
  const agg = new Map();
  for (const l of G.links) {
    if (l.s.project === l.t.project) continue;
    const key = [l.s.project, l.t.project].sort().join('|');
    agg.set(key, (agg.get(key) || 0) + 1);
  }
  return [...agg.entries()].map(([k, n]) => {
    const [a, b] = k.split('|');
    return { source: 'P:' + a, target: 'P:' + b, type: 'copy', weight: n,
      s: hubs.find(h => h.project === a), t: hubs.find(h => h.project === b) };
  });
})();
const rootHubs = ROOTS.map(r => {
  const ps = hubs.filter(h => G.projects.find(p => p.id === h.project).root === r);
  return { id: 'R:' + r, isRoot: true, root: r, label: r, rel: r, project: '', dir: '', kind: 'project',
    path: G.projects.find(p => p.root === r).path.replace(/\/[^/]*$/, ''),
    group: true, count: ps.reduce((a, h) => a + h.count, 0), nproj: ps.length,
    core: ps.reduce((a, h) => a + h.core, 0), fixed: true,
    color: ROOT_COLOR[ROOTS.indexOf(r) % ROOT_COLOR.length] };
});
hubs.forEach(h => { h.root = G.projects.find(p => p.id === h.project).root; });
const treeLinks = hubs.map(h => {
  const r = rootHubs.find(x => x.root === h.root);
  return { source: r.id, target: h.id, type: 'tree', s: r, t: h, c: r.color };
});
// MANAGE 는 다른 상위 폴더들을 위에서 관리한다 → 맨 위에 두고 다른 상위 폴더로 선을 잇는다
const MANAGER = ROOTS.includes(G.manager) ? G.manager : null;
const managerHub = rootHubs.find(r => r.root === MANAGER);
if (managerHub) managerHub.manager = true;
const manageLinks = managerHub ? rootHubs.filter(r => r !== managerHub).map(r =>
  ({ source: managerHub.id, target: r.id, type: 'tree', s: managerHub, t: r, c: managerHub.color })) : [];
const colorOf = n => n.color || (KIND[n.kind] || KIND.data).c;

// 상위 폴더나 프로젝트를 고르면, 그 폴더에서 일하는 Claude 에이전트를 VS Code 안에서 볼 수 있는 버튼을 띄운다
function agentRoot() {
  try {
    if (state.root) return rootHubs.find(r => r.root === state.root) || null;
    const p = G.projects.find(p => p.id === state.project);
    if (!p) return null;
    // 프로젝트 폴더에 자체 에이전트 팀(.claude/agents)이 있으면 그 폴더를 쓴다
    if (p.agents) return { root: `${p.root}/${p.name}`, path: p.path };
    return rootHubs.find(r => r.root === p.root) || null;
  } catch (e) { return null; }
}
function updateAgents() {
  const el = document.getElementById('agents'), r = agentRoot();
  el.style.display = r && vscodeApi ? 'flex' : 'none';
  if (r) document.getElementById('agentsLabel').textContent = r.root;
}
document.getElementById('agFlow').onclick = () => {
  const r = agentRoot(); if (r && vscodeApi) vscodeApi.postMessage({ type: 'agents', path: r.path });
};
document.getElementById('agTerm').onclick = () => {
  const r = agentRoot(); if (r && vscodeApi) vscodeApi.postMessage({ type: 'claude', path: r.path });
};

function rebuild(relayout) {
  const pid = state.project;
  if (pid === '*') {
    // 상위 폴더(작업공간 루트)를 큰 신경세포로, 그 둘레에 프로젝트를 배치
    const roots = rootHubs.filter(r => !state.root || r.root === state.root);
    const hs = hubs.filter(h => roots.some(r => r.root === h.root));
    nodes = [...roots, ...hs];
    const keep = new Set(nodes.map(n => n.id));
    links = [...manageLinks, ...treeLinks, ...hubLinks].filter(l => keep.has(l.source) && keep.has(l.target));
    hs.forEach(h => { h.deg = h.core; h.r = 10 + Math.log2(h.count + 1) * 3.2; });
    roots.forEach(r => { r.deg = r.core; r.r = 30; });
    adjOut = new Map(); adjIn = new Map();
    clusters = [];
    // MANAGE 와 다른 상위 폴더가 함께 보이면 MANAGE 는 위 가운데, 나머지는 그 아래 한 줄
    const top = roots.length > 1 && roots.find(r => r.manager);
    const row = roots.filter(r => r !== top);
    if (top) { top.r = 38; top.deg = top.core + row.length; }
    roots.forEach(r => {
      const ri = row.indexOf(r);
      const cx = r === top ? 0 : (ri - (row.length - 1) / 2) * 1150, cy = r === top ? -1150 : 0;
      r.x = r.tx0 = cx; r.y = cy; r.vx = r.vy = 0;
      r.cl = { id: r.id, cx, cy };
      const mine = hs.filter(h => h.root === r.root).sort((a, b) => b.count - a.count);
      mine.forEach((h, i) => {
        // 아래쪽(이름 자리)은 비우고 왼쪽·위·오른쪽으로 펼친다

    const isSel = state.sel === n, isHov = hov === n, isMatch = matchSet.has(n.id);
    ctx.globalAlpha = lit ? 1 : 0.12;
    // 빛번짐
    if (lit && (n.deg || isSel)) {
      const gr = n.r * (isSel || isHov ? 4 : 2.6);
      const g = ctx.createRadialGradient(n.x, n.y, n.r * 0.4, n.x, n.y, gr);
      g.addColorStop(0, K.c + (isSel ? '88' : '44')); g.addColorStop(1, K.c + '00');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(n.x, n.y, gr, 0, 7); ctx.fill();
    }
    ctx.fillStyle = n.deg ? K.c : '#0b0b16';
    ctx.strokeStyle = K.c; ctx.lineWidth = 1.4 / Math.sqrt(view.k);
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 7); ctx.fill(); ctx.stroke();
    if (n.deg) { ctx.fillStyle = '#ffffffcc'; ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 0.35, 0, 7); ctx.fill(); }
    if (n.group) {
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3.5 / Math.sqrt(view.k), 0, 7); ctx.stroke();
    }
    if (isSel || isMatch) {
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2 / view.k;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 7 / view.k, 0, 7); ctx.stroke();
    }
  }
  // 이름 (중요한 것부터, 이미 그린 이름과 겹치면 생략)
  if (state.project === '*') {
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (const n of nodes) {
      ctx.globalAlpha = n.core || n.manager ? 1 : 0.5;
      if (n.isRoot) {
        ctx.textBaseline = 'middle';
        ctx.font = `700 ${Math.max(18, 22 / view.k)}px Segoe UI, Malgun Gothic`;
        ctx.fillStyle = '#ffffff'; ctx.lineWidth = 5 / view.k; ctx.strokeStyle = '#0b0b16';
        const ty = n.y + n.r + Math.max(22, 26 / view.k);
        ctx.strokeText('🗂 ' + n.label, n.x, ty);
        ctx.fillText('🗂 ' + n.label, n.x, ty);
        ctx.font = `${Math.max(12, 13 / view.k)}px Segoe UI, Malgun Gothic`; ctx.fillStyle = n.color;
        const sub = (n.manager && nodes.some(m => m.isRoot && m !== n) ? '관리 · ' : '') + `프로젝트 ${n.nproj} · 파일 ${n.count}`;
        ctx.strokeText(sub, n.x, ty + Math.max(24, 28 / view.k));
        ctx.fillText(sub, n.x, ty + Math.max(24, 28 / view.k));
        ctx.textBaseline = 'top';
        continue;
      }
      ctx.font = `600 ${Math.max(13, 15 / view.k)}px Segoe UI, Malgun Gothic`;
      ctx.fillStyle = '#ffffff'; ctx.lineWidth = 4 / view.k; ctx.strokeStyle = '#0b0b16';
      ctx.strokeText(n.label, n.x, n.y + n.r + 6); ctx.fillText(n.label, n.x, n.y + n.r + 6);
      ctx.font = `${Math.max(11, 12 / view.k)}px Segoe UI, Malgun Gothic`; ctx.fillStyle = '#9a9ab8';
      const sub = `파일 ${n.count} · 흐름 ${n.core}`, dy = n.y + n.r + 6 + Math.max(17, 19 / view.k);
      ctx.strokeText(sub, n.x, dy); ctx.fillText(sub, n.x, dy);
    }
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
    ctx.restore(); ctx.globalAlpha = 1;
    return;
  }
  const fs = Math.max(12, 13 / view.k);
  ctx.font = `${fs}px Segoe UI, Malgun Gothic`; ctx.textBaseline = 'middle';
  const pri = n => (n === state.sel || n === hov ? 1e6 : 0) + (matchSet.has(n.id) ? 1e5 : 0) +
    (lineage && lineage.direct.has(n.id) ? 1e4 : 0) + (lineage && isLit(n.id) ? 1e3 : 0) + n.deg;
  const order = nodes.slice().sort((a, b) => pri(b) - pri(a));
  const boxes = [];
  for (const n of order) {
    const lit = isLit(n.id);
    const must = n === hov || n === state.sel || matchSet.has(n.id) || (lineage && lineage.direct.has(n.id));
    if (!must && !(state.labels && lit)) continue;
    const txt = n.group ? `${n.label} (${n.count})` : n.label;
    const w = ctx.measureText(txt).width, x = n.x + n.r + 4, y = n.y;
    const box = [x - 2, y - fs * 0.6, x + w + 2, y + fs * 0.6];
    if (!must && boxes.some(b => box[0] < b[2] && box[2] > b[0] && box[1] < b[3] && box[3] > b[1])) continue;
    boxes.push(box);
    ctx.globalAlpha = lit ? (n.deg || n === hov ? 0.95 : 0.55) : 0.2;
    ctx.fillStyle = n === state.sel || n === hov ? '#ffffff' : '#d8d8ea';
    ctx.lineWidth = 3 / view.k; ctx.strokeStyle = '#0b0b16';
    ctx.strokeText(txt, x, y); ctx.fillText(txt, x, y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

function loop(t) {
  tick();
  draw(t);
  requestAnimationFrame(loop);
}

// ───────────── 상호작용 ─────────────
const tip = document.getElementById('tip');
function toWorld(ev) {
  const r = cv.getBoundingClientRect();
  return [(ev.clientX - r.left - view.x) / view.k, (ev.clientY - r.top - view.y) / view.k];
}
function pick(ev) {
  const [x, y] = toWorld(ev);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < n.r + 6 / view.k && d < bd) { best = n; bd = d; }
  }
  return best;
}
let dragging = null, panning = null, moved = false;
cv.addEventListener('mousedown', ev => {
  moved = false;
  const n = pick(ev);
  if (n) { dragging = n; alpha = Math.max(alpha, 0.15); }
  else panning = { x: ev.clientX - view.x, y: ev.clientY - view.y };
  cv.classList.add('drag');
});
window.addEventListener('mousemove', ev => {
  if (dragging) {
    const [x, y] = toWorld(ev); dragging.x = x; dragging.y = y;
    if (layoutMode() === 'layer') { dragging.tx = x; dragging.ty = y; }
    moved = true; alpha = Math.max(alpha, 0.12); return;
  }
  if (panning) { view.x = ev.clientX - panning.x; view.y = ev.clientY - panning.y; moved = true; return; }
  if (ev.target !== cv) return;
  const n = pick(ev);
  state.hover = n;
  cv.style.cursor = n ? 'pointer' : 'grab';
  if (n) {
    const r = cv.parentElement.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 300) + 'px';
    tip.style.top = (ev.clientY - r.top + 14) + 'px';
    tip.innerHTML = n.isRoot
      ? `<div>🗂 ${esc(n.label)}</div><div class="p">프로젝트 ${n.nproj}개 · 파일 ${n.count}개 · 클릭하면 이 폴더만 보기</div>`
      : n.hub
      ? `<div>📁 ${esc(n.label)}</div><div class="p">파일 ${n.count}개 · 읽기/생성/import 관계 ${n.core}개 · 클릭해서 들어가기</div>`
      : `<div>${esc(n.group ? `${n.label} · ${n.count}개` : n.label)}</div><div class="p">${esc(n.project.split('/')[1])} / ${esc(n.rel)}</div>`;
  } else tip.style.display = 'none';
});
window.addEventListener('mouseup', ev => {
  if (!moved && ev.target === cv) {
    const n = pick(ev);
    if (n) select(n);
    else if (!state.focus) { state.sel = null; lineage = null; hideInfo(); }
  }
  dragging = null; panning = null; cv.classList.remove('drag');
});
cv.addEventListener('dblclick', ev => { const n = pick(ev); if (n) openPath(n, n.hub || n.isRoot); });
cv.addEventListener('wheel', ev => {
  ev.preventDefault();
  const r = cv.getBoundingClientRect(), mx = ev.clientX - r.left, my = ev.clientY - r.top;
  const k2 = Math.min(5, Math.max(0.08, view.k * Math.exp(-ev.deltaY * 0.0015)));
  view.x = mx - (mx - view.x) * k2 / view.k; view.y = my - (my - view.y) * k2 / view.k; view.k = k2;
}, { passive: false });
document.getElementById('fit').onclick = fitView;
window.addEventListener('resize', () => { resize(); });

const q = document.getElementById('q');
q.addEventListener('input', () => {
  state.query = q.value.trim().toLowerCase();
  matchSet = new Set(matches().map(n => n.id));
});
q.addEventListener('keydown', ev => {
  if (ev.key !== 'Enter') return;
  let m = matches();
  if (!m.length && state.query) {   // 다른 프로젝트에 있으면 그 프로젝트로 이동
    const hit = G.nodes.find(n => n.label.toLowerCase().includes(state.query));
    if (hit) m = [hit];
  }
  if (m.length) select(m[0]);
});
function centerOn(n) { view.x = W / 2 - n.x * view.k; view.y = H / 2 - n.y * view.k; }

function select(n) {
  if (n.isRoot) { setRoot(state.root === n.root ? null : n.root); return; }
  if (n.hub) { setProject(n.project); return; }
  if (n.project !== state.project) { state.project = n.project; renderProjects(); }
  if (n !== state.focus) state.depth = 2;
  state.focus = n; rebuild(true);
  state.sel = n; lineage = computeLineage(n); showInfo(n);
}

// ───────────── 상세 패널 ─────────────
const info = document.getElementById('info');
function hideInfo() { info.style.display = 'none'; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]); }
function fmtSize(b) { return b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b > 1e3 ? (b / 1e3).toFixed(0) + ' KB' : b + ' B'; }
function showInfo(n) {
  const K = KIND[n.kind] || KIND.data;
  const ins = (adjIn.get(n.id) || []), outs = (adjOut.get(n.id) || []);
  const sec = (title, arr, key) => {
    if (!arr.length) return '';
    return `<div class="grp"><b>${title} · ${arr.length}</b>` + arr.map(l => {
      const o = l[key];
      return `<div class="it" data-id="${esc(o.id)}"><span class="dot" style="color:${(KIND[o.kind] || KIND.data).c};width:8px;height:8px"></span><span title="${esc(o.rel)}">${esc(o.group ? o.label + ' (' + o.count + ')' : o.label)}</span></div>`;
    }).join('') + '</div>';
  };
  const f = (arr, t) => arr.filter(l => l.type === t);
  const up = lineage.up.size, down = lineage.down.size;
  info.innerHTML = `<button id="close">✕</button>
    <h2><span class="dot" style="color:${K.c};width:9px;height:9px"></span> ${esc(n.group ? n.label + ' · ' + n.count + '개' : n.label)}</h2>
    <div class="p">${esc(n.project)} / ${esc(n.rel)}</div>
    <div class="p">${K.t}${n.size ? ' · ' + fmtSize(n.size) : ''} · 상류 ${up} · 하류 ${down}</div>
    <div class="btns">
      ${n.group ? '' : '<button id="op">VS Code에서 열기</button>'}
      <button id="rv">탐색기에서 보기</button>
    </div>
    ${sec('⬅ 읽어오는 데이터', f(ins, 'read'), 's')}
    ${sec('⬅ import 하는 모듈', f(ins, 'import'), 's')}
    ${sec('➡ 만들어내는 결과물', f(outs, 'write'), 't')}
    ${sec('➡ 이 파일을 읽는 곳', f(outs, 'read'), 't')}
    ${sec('➡ 이 모듈을 import 하는 곳', f(outs, 'import'), 't')}
    ${sec('⬅ 이 파일을 만드는 곳', f(ins, 'write'), 's')}
    ${sec('경로만 참조', [...f(ins, 'use')], 's')}
    ${sec('경로만 참조하는 곳', [...f(outs, 'use')], 't')}
    ${sec('📝 이 문서가 언급하는 파일', f(outs, 'mention'), 't')}
    ${sec('📝 이 파일을 언급하는 문서', f(ins, 'mention'), 's')}
    ${sec('⧉ 같은 내용 사본', [...f(outs, 'copy'), ...f(ins, 'copy').map(l => ({ ...l, t: l.s }))], 't')}
  `;
  info.style.display = 'block';
  info.querySelector('#close').onclick = () => hideInfo();
  const op = info.querySelector('#op'); if (op) op.onclick = () => openPath(n);
  info.querySelector('#rv').onclick = () => openPath(n, true);
  info.querySelectorAll('.it').forEach(el => el.onclick = () => {
    const o = byId.get(el.dataset.id);
    if (o) select(o);
  });
}
function updateStats() {
  const t = {};
  links.forEach(l => t[l.type] = (t[l.type] || 0) + 1);
  document.getElementById('stats').textContent = state.project === '*' ? `프로젝트 ${nodes.filter(n => n.hub).length}개` :
    `파일 ${nodes.length} · ` + Object.entries(t).map(([k, v]) => `${TYPE[k].t.split(' ')[0]} ${v}`).join(' · ');
}

resize();
renderProjects();
rebuild(true);
requestAnimationFrame(loop);
</script>
</body>
</html>
